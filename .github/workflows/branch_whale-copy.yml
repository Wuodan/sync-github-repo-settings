name: "Branch: Whale Copy"
run-name: Branch Whale Copy aicage/aicage package

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: copy-package-aicage
  cancel-in-progress: false

env:
  SOURCE_DB_ARTIFACT_URL: https://github.com/aicage/aicage-image/actions/runs/27798336530/artifacts/7739739676
  TARGET_OWNER: wuodan
  TARGET_PACKAGE: aicage-backup

jobs:
  whale-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: temp-package-copy/package.json

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.24"

      - name: Install dependencies
        shell: bash
        run: npm install
        working-directory: temp-package-copy

      - name: Install crane
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.7
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Copy whale package slice
        shell: bash
        env:
          COPY_DELAY_SECONDS: 0
          GITHUB_TOKEN: ${{ secrets.GH_TEST_PAT }}
          REGISTRY_USERNAME: ${{ vars.GH_TEST_PAT_USERNAME }}
          SOURCE_DB_ARTIFACT_URL: ${{ env.SOURCE_DB_ARTIFACT_URL }}
          TARGET_OWNER: ${{ env.TARGET_OWNER }}
          TARGET_PACKAGE: ${{ env.TARGET_PACKAGE }}
        run: |
          set -euo pipefail
          crane auth login ghcr.io -u "$REGISTRY_USERNAME" -p "$GITHUB_TOKEN"
          node temp-package-copy/tools/copy-whale-package.mjs
