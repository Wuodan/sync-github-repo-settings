name: Test Suite

"on":
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  test-suite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-dev.txt

      - name: Run linters
        run: |
          ./scripts/lint.sh

      - name: Ensure workflow actions use immutable refs
        uses: joshjohanning/ensure-immutable-actions@95f404c7ba212d486ec843666f0ffbd080959f63  # v2.7.1
        with:
          include-first-party: 'true'
          write-job-summary: 'on-failure-only'

  super-linter:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MULTI_STATUS: false
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
