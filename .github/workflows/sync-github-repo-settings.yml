name: sync-github-repo-settings

"on":
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only without applying changes
        required: false
        type: boolean
        default: false
      owner:
        description: Optional owner regex filter
        required: false
        type: string

permissions: {}

jobs:
  discover-owners:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build owner matrix
        id: discover
        env:
          OWNER_FILTER: ${{ inputs.owner }}
        run: |
          matrix_json="$(./scripts/build-owner-matrix.sh config/owners "${OWNER_FILTER}")"
          echo "Owner matrix:" >&2
          jq . <<< "${matrix_json}" >&2
          echo "matrix=${matrix_json}" >> "${GITHUB_OUTPUT}"

  sync:
    needs: discover-owners
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-owners.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect owner
        id: owner
        env:
          OWNER_CONFIG_FILE: ${{ matrix.owner_config_file }}
        run: |
          echo "owner=$(basename "${OWNER_CONFIG_FILE}" .yml)" >> "${GITHUB_OUTPUT}"

      - name: Detect owner type
        id: owner-type
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          github_owner_type="$(./scripts/detect-owner-type.sh "${OWNER}")"
          echo "GitHub Owner Type: ${github_owner_type}" >&2
          owner_type="$(sed -e 's/^User$/user/' -e 's/^Organization$/org/' <<< "${github_owner_type}")"
          echo "Owner Type: ${owner_type}" >&2
          echo "owner_type=${owner_type}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.owner.outputs.owner }}  # zizmor: ignore[github-app] All configured repositories.
          permission-administration: write
          permission-contents: write
          permission-pull-requests: write

      - name: Verify all repos configured for Dependabot
        id: verify-dependabot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ steps.owner.outputs.owner }}
          OWNER_TYPE: ${{ steps.owner-type.outputs.owner_type }}
          OWNER_CONFIG_FILE: ${{ matrix.owner_config_file }}
        run: |
          ./scripts/check-dependabot-coverage.sh >> "${GITHUB_STEP_SUMMARY}"

      - name: Update repository settings
        id: sync-settings
        uses: Wuodan/bulk-github-repo-settings-sync-action@c8590cfda2762e49c6e12dc0525ebd344af64282  # v2.12.1-alpha01
        # uses: joshjohanning/bulk-github-repo-settings-sync-action@f4c247dd32d37e0ffdb0f728e7c90bbe0b67d5f6  # v2.12.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repositories-file: ${{ matrix.owner_config_file }}
          immutable-releases: true
          code-scanning: true
          secret-scanning: true
          secret-scanning-push-protection: true
          # private-vulnerability-reporting: true
          dependabot-alerts: true
          dependabot-security-updates: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Print sync action outputs
        env:
          UPDATED_REPOSITORIES: ${{ steps.sync-settings.outputs.updated-repositories }}
          CHANGED_REPOSITORIES: ${{ steps.sync-settings.outputs.changed-repositories }}
          UNCHANGED_REPOSITORIES: ${{ steps.sync-settings.outputs.unchanged-repositories }}
          FAILED_REPOSITORIES: ${{ steps.sync-settings.outputs.failed-repositories }}
          WARNING_REPOSITORIES: ${{ steps.sync-settings.outputs.warning-repositories }}
          RESULTS: ${{ steps.sync-settings.outputs.results }}
        run: |
          echo "updated-repositories=${UPDATED_REPOSITORIES}"
          echo "changed-repositories=${CHANGED_REPOSITORIES}"
          echo "unchanged-repositories=${UNCHANGED_REPOSITORIES}"
          echo "failed-repositories=${FAILED_REPOSITORIES}"
          echo "warning-repositories=${WARNING_REPOSITORIES}"
          echo "::group::results"
          echo "${RESULTS}" | jq
          echo "::endgroup::"

      - name: Fail on warnings or failures
        id: fail-on-warnings
        continue-on-error: true
        env:
          FAILED_REPOSITORIES: ${{ steps.sync-settings.outputs.failed-repositories }}
          WARNING_REPOSITORIES: ${{ steps.sync-settings.outputs.warning-repositories }}
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          failed_repositories="${FAILED_REPOSITORIES}"
          warning_repositories="${WARNING_REPOSITORIES}"

          if (( failed_repositories > 0 || warning_repositories > 0 )); then
            echo "Sync reported warnings or failures for ${OWNER}" >&2
            echo "Failed repositories: ${failed_repositories}" >&2
            echo "Warning repositories: ${warning_repositories}" >&2
            exit 1
          fi

      - name: Fail job if any verification step failed
        if: always()
        env:
          VERIFY_DEPENDABOT_OUTCOME: ${{ steps.verify-dependabot.outcome }}
          FAIL_ON_WARNINGS_OUTCOME: ${{ steps.fail-on-warnings.outcome }}
          OWNER: ${{ steps.owner.outputs.owner }}
        run: |
          failed=0

          if [[ "${VERIFY_DEPENDABOT_OUTCOME}" == 'failure' ]]; then
            echo "'Verify all repos configured for Dependabot' failed for ${OWNER}" >&2
            failed=1
          fi

          if [[ "${FAIL_ON_WARNINGS_OUTCOME}" == 'failure' ]]; then
            echo "'Fail on warnings or failures' detected warnings or failures for ${OWNER}" >&2
            failed=1
          fi

          if (( failed )); then
            exit 1
          fi
