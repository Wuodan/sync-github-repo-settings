owner: aicage

ignore_repos: []

dependabot:
  profiles:
    actions-only: ./config/dependabot/actions-only.yml
    go-actions: ./config/dependabot/go-actions.yml
    pip-actions: ./config/dependabot/pip-actions.yml
    pip-docker-actions: ./config/dependabot/pip-docker-actions.yml
  repos:
    acp-wsl: go-actions
    aicage: pip-actions
    aicage-custom-samples: actions-only
    aicage-image: pip-docker-actions
    aicage-image-base: pip-docker-actions
    aicage-image-util: pip-docker-actions

rules:
  - selector:
      all: true
      fork: false
    settings:
      rulesets-file: |
        ./config/rulesets/commits-must-be-signed.json
        ./config/rulesets/require-PR-for-default-branch.json
        ./config/rulesets/required-status-checks.json

  - selector:
      repos:
        - acp-wsl
    fork: false
    settings:
      dependabot-yml: ./config/dependabot/go-actions.yml
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/aicage/acp-wsl/renovate.json
          target: renovate.json

  - selector:
      repos:
        - aicage-custom-samples
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/actions-only.yml
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/actions-only.json
          target: renovate.json

  - selector:
      repos:
        - aicage
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/pip-actions.yml
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/pip-actions.json
          target: renovate.json

  - selector:
      repos:
        - aicage-image
        - aicage-image-base
        - aicage-image-util
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/pip-docker-actions.yml
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/pip-docker-actions.json
          target: renovate.json
