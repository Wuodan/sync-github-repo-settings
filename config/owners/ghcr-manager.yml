owner: ghcr-manager

ignore_repos: []

dependabot:
  profiles:
    actions-only: ./config/dependabot/actions-only.yml
    npm-actions: ./config/dependabot/npm-actions.yml
  repos:
    ghcr-cleanup-manager: npm-actions
    ghcr-manager: actions-only
    ghcr-untag-action: npm-actions

rules:
  - selector:
      all: true
      fork: false
    settings: {}

  - selector:
      repos:
        - ghcr-manager
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/actions-only.yml

  - selector:
      repos:
        - ghcr-cleanup-manager
        - ghcr-untag-action
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/npm-actions.yml
