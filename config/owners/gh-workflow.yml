owner: gh-workflow

ignore_repos: []

dependabot:
  profiles:
    actions-only: ./config/dependabot/actions-only.yml
    pip-actions: ./config/dependabot/pip-actions.yml
  repos:
    action-template: pip-actions
    container-host-user: actions-only
    image-sbom: actions-only
    multiarch-image-publish: pip-actions
    setup-docker-desktop-macos: pip-actions
    setup-docker-wsl: actions-only

rules:
  - selector:
      all: true
      fork: false
    settings:
      rulesets-file: ./config/rulesets/commits-must-be-signed.json

  - selector:
      repos:
        - container-host-user
        - image-sbom
        - setup-docker-wsl
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/actions-only.yml

  - selector:
      repos:
        - container-host-user
        - image-sbom
      fork: false
    settings:
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/actions-only.json
          target: renovate.json

  - selector:
      repos:
        - setup-docker-wsl
      fork: false
    settings:
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/gh-workflow/setup-docker-wsl/renovate.json
          target: renovate.json

  - selector:
      repos:
        - action-template
        - setup-docker-desktop-macos
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/pip-actions.yml
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/pip-actions.json
          target: renovate.json

  - selector:
      repos:
        - multiarch-image-publish
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/pip-actions.yml
      file-sync:
        - name: Renovate configuration
          source: ./config/renovate/pip-actions.json
          target: renovate.json
