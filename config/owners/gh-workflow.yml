owner: gh-workflow

ignore_repos: []

dependabot:
  profiles:
    actions-only: ./config/dependabot/actions-only.yml
    pip-actions: ./config/dependabot/pip-actions.yml
  repos:
    action-template: pip-actions
    container-host-user: actions-only
    image-sbom: actions-only
    multiarch-image-publish: pip-actions
    setup-docker-desktop-macos: pip-actions

rules:
  - selector:
      all: true
      fork: false
    settings:
      rulesets-file: ./config/rulesets/commits-must-be-signed.json

  - selector:
      repos:
        - container-host-user
        - image-sbom
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/actions-only.yml

  - selector:
      repos:
        - action-template
        - multiarch-image-publish
        - setup-docker-desktop-macos
      fork: false
    settings:
      dependabot-yml: ./config/dependabot/pip-actions.yml
